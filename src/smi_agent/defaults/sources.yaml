# Реестр источников по умолчанию (ТЗ §6). Это ДАННЫЕ: источники добавляются/удаляются через UI/API без правки кода.
# verified_url: true — адрес проверен вручную 2026-09-30; false — «известный» адрес, требует проверки (см. Настройки → Источники).
# tier: primary (первичный/официальный) | quality (качественные СМИ) | specialized (профильные) | aggregator
# independence_group — «семья» изданий: материалы одной группы/агентства НЕ считаются независимыми подтверждениями.
