[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smi-agent"
version = "0.1.0"
description = "Персональный AI-главный редактор: мониторинг СМИ, отбор тем, авторский контент, публикация и аналитика"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "feedparser>=6.0.11",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "pyyaml>=6",
  "cryptography>=42",
  "pillow>=10.3",
  "alembic>=1.13",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout", "ruff"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
smi-agent = "smi_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smi_agent = ["web/static/**/*", "assets/**/*", "defaults/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -ra"
timeout = 120
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "S101", "S311", "B008", "S603", "S607", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"src/smi_agent/demo/*" = ["S"]
